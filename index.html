<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EDE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Nature Quest turns a local, open-weight AI into real-world outdoor missions. Generate a quest, put the phone away, go outside.">
<title>Nature Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-mark" aria-hidden="true"></div>

</div>
<div id="app" hidden></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
